schemaVersion: 1
id: "motion.shake-and-samples"
name: "Android shake and accelerometer capture"
appId: "ai.ansight.motion.testapp"
taskId: "motion.shake-and-samples"
prompt: >-
  Launch the motion test app on an Android emulator and run the motion.shake-and-samples task.
  Confirm the app starts with its sensor listener disabled, then observes injected shake and the
  custom accelerometer sample only after the listener is enabled.
validation:
  prompt: >-
    Verify the app reports Shake detected and Custom sample observed after the injections, and the
    task named assertions passed.
  assertions:
    - "The app shows no sensor samples before enabling its listener."
    - "The app reports Shake detected after the injected shake."
    - "The app reports Custom sample observed after the 32 m/s2 sample."
