# yaml-language-server: $schema=../schema/test-definition.v1.schema.json
schemaVersion: 1
id: "avalonia.navigation"
name: "Avalonia Navigation"
appId: "com.jsuarezruiz.bubbletabbar"
prompt: |-
  Observe the current BubbleTabBar screen. Visit all five bottom navigation tabs
  using real device taps, observing the fresh screenshot after each tap. Verify
  that the selected tab's highlight and its associated content visibly change.
  Use captured selectors when available; inspect the screenshot before any
  coordinate fallback. Do not select tabs by setting an Avalonia property.

  Return to Home, then select Gallery and verify the image-card grid and Gallery
  selection. Scroll the grid once and verify that the content moves while the
  bottom navigation remains visible. Retain the screenshots and touch evidence.

  Run @task/avalonia.inspect to verify both framework trees and retained numeric
  render/layout/input/FPS telemetry. Any missing measurement fails this scenario.
validation: |-
  All five tabs were exercised through device input. Gallery is selected at the
  end, its grid scrolled, both trees are present, and avalonia.inspect passed
  every named assertion. Do not treat tool publication or build success as proof.
