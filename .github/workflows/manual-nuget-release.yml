name: Manual NuGet Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: NuGet package version to build, for example 0.1.0 or 0.1.0-rc.1
        required: true
        type: string
      publish:
        description: Publish the generated packages to nuget.org
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  EXPECTED_PACKAGES: >-
    Ansight
    Ansight.Tools.VisualTree
    Ansight.Tools.Database
    Ansight.Tools.FileSystem
    Ansight.Tools.Preferences
    Ansight.Tools.SecureStorage

concurrency:
  group: manual-nuget-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and Pack
    runs-on: macos-latest
    timeout-minutes: 45
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Normalize version
        id: version
        shell: bash
        run: |
          version="${{ inputs.version }}"
          version="${version#v}"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Version must be a SemVer package version such as 1.2.3 or 1.2.3-rc.1." >&2
            exit 1
          fi

          echo "package_version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore workloads
        run: dotnet workload restore src/dotnet/Ansight.Sdk.sln

      - name: Restore
        run: dotnet restore src/dotnet/Ansight.Sdk.sln

      - name: Build
        run: >
          dotnet build src/dotnet/Ansight.Sdk.sln
          -c Release
          --no-restore
          -p:PackageVersion=${{ steps.version.outputs.package_version }}
          -p:GeneratePackageOnBuild=false
          -p:ContinuousIntegrationBuild=true

      - name: Run unit tests
        run: dotnet test src/dotnet/tests/Ansight.UnitTests/Ansight.UnitTests.csproj -c Release --no-build --no-restore

      - name: Pack
        run: >
          dotnet pack src/dotnet/Ansight.Sdk.sln
          -c Release
          --no-build
          --output artifacts/nuget
          -p:PackageVersion=${{ steps.version.outputs.package_version }}
          -p:GeneratePackageOnBuild=false
          -p:IncludeSymbols=true
          -p:SymbolPackageFormat=snupkg
          -p:ContinuousIntegrationBuild=true

      - name: Verify package set
        shell: bash
        run: |
          version="${{ steps.version.outputs.package_version }}"
          read -r -a expected_packages <<< "$EXPECTED_PACKAGES"

          shopt -s nullglob
          packages=(artifacts/nuget/*.nupkg)
          symbols=(artifacts/nuget/*.snupkg)
          missing=0

          if (( ${#packages[@]} != ${#expected_packages[@]} )); then
            echo "Expected ${#expected_packages[@]} .nupkg files but found ${#packages[@]}." >&2
            missing=1
          fi

          if (( ${#symbols[@]} != ${#expected_packages[@]} )); then
            echo "Expected ${#expected_packages[@]} .snupkg files but found ${#symbols[@]}." >&2
            missing=1
          fi

          for package_id in "${expected_packages[@]}"; do
            package_path="artifacts/nuget/${package_id}.${version}.nupkg"
            symbol_path="artifacts/nuget/${package_id}.${version}.snupkg"

            if [[ ! -f "$package_path" ]]; then
              echo "Missing package: $package_path" >&2
              missing=1
            fi

            if [[ ! -f "$symbol_path" ]]; then
              echo "Missing symbol package: $symbol_path" >&2
              missing=1
            fi
          done

          if (( missing )); then
            echo "Package verification failed." >&2
            exit 1
          fi

          printf '%s\n' "${packages[@]}" "${symbols[@]}" | sort

      - name: Verify package license files
        shell: bash
        run: |
          shopt -s nullglob
          packages=(artifacts/nuget/*.nupkg)

          for package in "${packages[@]}"; do
            temp_dir="$(mktemp -d)"
            package_dir="${temp_dir}/package"
            mkdir -p "$package_dir"

            unzip -q "$package" -d "$package_dir"

            if [[ ! -f "$package_dir/LICENSE" ]]; then
              echo "Missing LICENSE file in ${package}." >&2
              exit 1
            fi

            if ! grep -q "Ansight SDK Source-Available License" "$package_dir/LICENSE"; then
              echo "Package ${package} does not contain the Ansight SDK Source-Available License." >&2
              exit 1
            fi

            nuspecs=("$package_dir"/*.nuspec)
            if (( ${#nuspecs[@]} != 1 )); then
              echo "Expected one nuspec in ${package}, found ${#nuspecs[@]}." >&2
              exit 1
            fi

            if grep -q '<license type="expression">' "${nuspecs[@]}"; then
              echo "Package ${package} still declares SPDX expression license metadata." >&2
              exit 1
            fi

            if ! grep -q '<license type="file">LICENSE</license>' "${nuspecs[@]}"; then
              echo "Package ${package} does not declare LICENSE as its package license file." >&2
              exit 1
            fi

            rm -rf "$temp_dir"
          done

      - name: Verify Ansight developer pairing script in package
        shell: bash
        run: |
          version="${{ steps.version.outputs.package_version }}"
          package_path="artifacts/nuget/Ansight.${version}.nupkg"
          temp_dir="$(mktemp -d)"
          package_dir="${temp_dir}/package"
          input_path="${temp_dir}/ansight.json"
          output_path="${temp_dir}/ansight.developer-pairing.json"

          unzip -q "$package_path" -d "$package_dir"

          cat > "$input_path" <<'EOF'
          {
            "schema": "ansight.pairing-config.v1",
            "configId": "manual-release-check",
            "appId": "ai.ansight.test",
            "appName": "Manual Release Check",
            "issuedAt": "2026-01-01T00:00:00Z",
            "expiresAt": "2027-01-01T00:00:00Z",
            "oneTimeToken": "manual-release-check-token",
            "host": {
              "hostId": "manual-release-check-host",
              "hostName": "Manual Release Check Host",
              "discoveryPort": 45123,
              "hostPubKey": "manual-release-check-key",
              "hostPubKeyFingerprint": "manual-release-check-fingerprint"
            },
            "challenge": {
              "alg": "ECDSA-P256",
              "challengePubKey": "manual-release-check-challenge-key",
              "requireProofOnFirstPair": true
            },
            "trust": {
              "mode": "pinned-key+token+challenge",
              "requireTokenOnFirstPair": true,
              "allowLanDiscovery": false
            },
            "signature": "manual-release-check-signature"
          }
          EOF

          bash "${package_dir}/buildTransitive/generate-ansight-developer-pairing.sh" "$input_path" "$output_path"

          if [[ ! -f "$output_path" ]]; then
            echo "Expected developer pairing output file was not generated." >&2
            exit 1
          fi

          if ! grep -q '"schema": "ansight.pairing-bootstrap.v1"' "$output_path"; then
            echo "Generated developer pairing file did not contain the bootstrap schema." >&2
            exit 1
          fi

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ steps.version.outputs.package_version }}
          path: artifacts/nuget/*
          if-no-files-found: error

  publish:
    name: Publish to nuget.org
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages-${{ needs.build.outputs.package_version }}
          path: artifacts/nuget

      - name: Verify downloaded package set
        shell: bash
        run: |
          version="${{ needs.build.outputs.package_version }}"
          read -r -a expected_packages <<< "$EXPECTED_PACKAGES"

          shopt -s nullglob
          packages=(artifacts/nuget/*.nupkg)
          symbols=(artifacts/nuget/*.snupkg)
          missing=0

          if (( ${#packages[@]} != ${#expected_packages[@]} )); then
            echo "Expected ${#expected_packages[@]} .nupkg files but found ${#packages[@]}." >&2
            missing=1
          fi

          if (( ${#symbols[@]} != ${#expected_packages[@]} )); then
            echo "Expected ${#expected_packages[@]} .snupkg files but found ${#symbols[@]}." >&2
            missing=1
          fi

          for package_id in "${expected_packages[@]}"; do
            package_path="artifacts/nuget/${package_id}.${version}.nupkg"
            symbol_path="artifacts/nuget/${package_id}.${version}.snupkg"

            if [[ ! -f "$package_path" ]]; then
              echo "Missing package: $package_path" >&2
              missing=1
            fi

            if [[ ! -f "$symbol_path" ]]; then
              echo "Missing symbol package: $symbol_path" >&2
              missing=1
            fi
          done

          if (( missing )); then
            echo "Package verification failed." >&2
            exit 1
          fi

      - name: Publish packages
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          NUGET_SOURCE: https://api.nuget.org/v3/index.json
        run: |
          version="${{ needs.build.outputs.package_version }}"
          read -r -a expected_packages <<< "$EXPECTED_PACKAGES"

          if [[ -z "$NUGET_API_KEY" ]]; then
            echo "NUGET_API_KEY secret is not configured." >&2
            exit 1
          fi

          for package_id in "${expected_packages[@]}"; do
            dotnet nuget push "artifacts/nuget/${package_id}.${version}.nupkg" \
              --api-key "$NUGET_API_KEY" \
              --source "$NUGET_SOURCE" \
              --skip-duplicate
          done

          for package_id in "${expected_packages[@]}"; do
            dotnet nuget push "artifacts/nuget/${package_id}.${version}.snupkg" \
              --api-key "$NUGET_API_KEY" \
              --source "$NUGET_SOURCE" \
              --skip-duplicate
          done
