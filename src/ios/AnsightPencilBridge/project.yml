name: AnsightPencilBridge
options:
  bundleIdPrefix: ai.ansight
  deploymentTarget:
    iOS: "15.0"
targets:
  AnsightPencilBridge:
    type: framework
    platform: iOS
    sources:
      - path: ../Sources/AnsightPencilRuntime
    settings:
      base:
        BUILD_LIBRARY_FOR_DISTRIBUTION: YES
        CODE_SIGNING_ALLOWED: NO
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0.0"
        PRODUCT_BUNDLE_IDENTIFIER: ai.ansight.pencil.bridge
        SKIP_INSTALL: NO
        SUPPORTS_MACCATALYST: YES
        SWIFT_INSTALL_OBJC_HEADER: YES
        SWIFT_VERSION: "6.0"
schemes:
  AnsightPencilBridge:
    build:
      targets:
        AnsightPencilBridge: all
    archive:
      config: Release
