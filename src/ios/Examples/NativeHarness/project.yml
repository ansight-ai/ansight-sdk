name: AnsightNativeHarness
options:
  minimumXcodeGenVersion: 2.38.0
packages:
  AnsightSDK:
    path: ../../
targets:
  AnsightNativeHarness:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - AnsightNativeHarness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.ansight.ios.native-harness
        PRODUCT_NAME: AnsightNativeHarness
        INFOPLIST_FILE: AnsightNativeHarness/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: 6.0
    dependencies:
      - package: AnsightSDK
        product: Ansight
