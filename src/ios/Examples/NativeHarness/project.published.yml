name: AnsightNativeHarnessPublished
options:
  minimumXcodeGenVersion: 2.38.0
packages:
  AnsightSDK:
    url: https://github.com/ansight-ai/ansight-sdk.git
    exactVersion: 1.0.2-preview.6
targets:
  AnsightNativeHarness:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - AnsightNativeHarness
      - path: ../../ansight.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.ansight.ios.native-harness
        PRODUCT_NAME: AnsightNativeHarness
        INFOPLIST_FILE: AnsightNativeHarness/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: 6.0
        ANSIGHT_DEVELOPER_PAIRING_ENABLED: true
    dependencies:
      - package: AnsightSDK
        product: Ansight
