name: AnsightDotNetBridge

options:
  bundleIdPrefix: ai.ansight
  deploymentTarget:
    iOS: "15.0"

targets:
  AnsightDotNetBridge:
    type: framework
    platform: iOS
    sources:
      - Sources
      - path: ../Sources/AnsightCore
        excludes:
          - README.md
          - AnsightGeneratedBuildArtifacts.swift
      - path: ../Sources/CAnsightCrashCapture
      - path: ../Sources/CAnsightWebP
        excludes:
          - COPYING
          - PATENTS
          - upstream.json
          - vendor
      - path: ../Sources/CAnsightWebP/vendor
        headerVisibility: private
    settings:
      base:
        BUILD_LIBRARY_FOR_DISTRIBUTION: YES
        CODE_SIGNING_ALLOWED: NO
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../Sources/CAnsightCrashCapture/include $(SRCROOT)/../Sources/CAnsightWebP/include $(SRCROOT)/../Sources/CAnsightWebP/vendor"
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) WEBP_USE_THREAD"
        MARKETING_VERSION: "1.0.0"
        OTHER_LDFLAGS: "$(inherited) -lz"
        PRODUCT_BUNDLE_IDENTIFIER: ai.ansight.dotnet.bridge
        SKIP_INSTALL: NO
        SUPPORTS_MACCATALYST: YES
        SWIFT_INSTALL_OBJC_HEADER: YES
        SWIFT_VERSION: "6.0"

schemes:
  AnsightDotNetBridge:
    build:
      targets:
        AnsightDotNetBridge: all
    archive:
      config: Release
