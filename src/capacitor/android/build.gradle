buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.13.0"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20"
    }
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

android {
    namespace = "ai.ansight.capacitor"
    compileSdk = project.hasProperty("compileSdkVersion") ? rootProject.ext.compileSdkVersion : 36

    defaultConfig {
        minSdk = project.hasProperty("minSdkVersion") ? rootProject.ext.minSdkVersion : 24
        targetSdk = project.hasProperty("targetSdkVersion") ? rootProject.ext.targetSdkVersion : 36
        versionCode = 1
        versionName = "1.0"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlin {
        jvmToolchain(21)
    }

    lint {
        abortOnError = false
    }

    publishing {
        singleVariant("release")
    }
}

dependencies {
    implementation project(":capacitor-android")
    def ansightAndroidVersion =
            findProperty("ansightAndroidVersion") ?: "1.3.0-preview.11"
    implementation "ai.ansight:ansight-android:1.3.0-preview.11"
}
