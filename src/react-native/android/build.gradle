buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath("com.android.tools.build:gradle:8.7.3")
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21")
  }
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

def safeExtGet(prop, fallback) {
  return rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

def reactNativeDir = rootProject.file("../node_modules/react-native")
if (!reactNativeDir.exists()) {
  reactNativeDir = file("../../node_modules/react-native")
}

android {
  namespace "ai.ansight.reactnative"
  compileSdkVersion safeExtGet("compileSdkVersion", 35)
  ndkVersion safeExtGet("ndkVersion", "27.1.12297006")

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 23)
    targetSdkVersion safeExtGet("targetSdkVersion", 35)

    externalNativeBuild {
      cmake {
        arguments "-DREACT_NATIVE_DIR=${reactNativeDir.absolutePath}"
        cppFlags "-std=c++17 -fexceptions -frtti"
      }
    }
  }

  sourceSets {
    main.java.srcDirs += "src/main/kotlin"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }

  externalNativeBuild {
    cmake {
      path "src/main/cpp/CMakeLists.txt"
    }
  }
}

repositories {
  mavenLocal()
  google()
  mavenCentral()
}

dependencies {
  implementation("com.facebook.react:react-android")
  implementation("ai.ansight:ansight-android:1.0.2-preview.6")
}
